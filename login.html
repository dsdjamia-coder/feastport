<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; script-src 'self' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' https: data: blob:; font-src 'self' https:; connect-src 'self' https: wss://*.firebaseio.com; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
  <title>Fest Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Manjari:wght@100;400;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@1.25.0"></script>
  <link rel="stylesheet" href="./login.css">
</head>
<body class="login-page">
  <div id="login-transition" class="fixed inset-0 z-[100] hidden items-center justify-center bg-white">
    <div class="text-center">
      <div class="relative mx-auto h-28 w-28">
        <div class="absolute inset-0 animate-spin rounded-full border-4 border-slate-100 border-t-indigo-600"></div>
        <div class="absolute inset-2 overflow-hidden rounded-full border border-slate-200 bg-white p-1 shadow-xl">
          <img data-fest-logo class="absolute inset-1 z-10 hidden rounded-full object-cover" alt="Fest logo">
          <div data-logo-fallback class="flex h-full w-full items-center justify-center rounded-full bg-indigo-50 text-2xl font-black text-indigo-600">F</div>
        </div>
      </div>
      <p id="transition-fest-name" class="mt-5 text-lg font-black text-slate-900">Fest</p>
      <p class="mt-1 text-xs font-bold uppercase tracking-[0.25em] text-slate-400">Loading</p>
    </div>
  </div>
  <main class="login-card">
    <section class="login-brand" aria-labelledby="login-fest-name">
      <a href="./index.html" class="login-back"><span aria-hidden="true">←</span> Festival home</a>
      <div class="login-identity">
        <div class="login-logo">
          <img data-fest-logo class="hidden" alt="">
          <span data-logo-fallback>F</span>
        </div>
        <p id="login-fest-name">Fest</p>
      </div>
    </section>

    <section class="login-content" aria-labelledby="login-title">
      <h1 id="login-title">Sign in</h1>
      <form id="standalone-login-form">
        <label for="login-identifier">Username or email</label>
        <input id="login-identifier" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        <label for="login-password">Password</label>
        <div class="login-password-field">
          <input id="login-password" type="password" autocomplete="current-password" required>
          <button id="login-toggle-password" type="button" aria-label="Show password" aria-controls="login-password"><i data-eye-icon data-lucide="eye" aria-hidden="true"></i><span data-password-label>Show</span></button>
        </div>
        <p id="login-error" role="alert"></p>
        <button id="login-button" type="submit"><span data-login-label>Sign in</span><span aria-hidden="true">→</span></button>
      </form>
    </section>
  </main>

  <script type="module" src="./login.js"></script>
</body>
</html>
