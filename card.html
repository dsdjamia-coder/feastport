<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Festival ID</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf1f3;color:#172935;font:1rem/1.5 Inter,system-ui,sans-serif}main{width:min(72rem,calc(100% - 1.5rem));margin:clamp(.75rem,4vw,3rem) auto}.card-shell{display:grid;grid-template-columns:minmax(16rem,25rem) minmax(0,1fr);gap:clamp(1rem,4vw,3rem);align-items:start}.identity-card{background:#fff;border-radius:1.25rem;padding:.75rem;box-shadow:0 18px 50px #24343b1c}.identity-card svg{display:block;width:100%;height:auto;max-height:70vh}.content{background:#fff;border-top:5px solid #147d77;border-radius:1.25rem;padding:clamp(1.25rem,5vw,3rem);box-shadow:0 18px 50px #24343b12}.eyebrow{color:#147d77;font-size:.75rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}h1{font-size:clamp(1.8rem,5vw,3rem);line-height:1.05;margin:.3rem 0}.meta{color:#526671;margin-top:.35rem}.event-list{list-style:none;padding:0;margin:1rem 0 0;display:grid;gap:.65rem}.event-list li{border:1px solid #dce5e8;border-radius:.8rem;padding:.8rem 1rem}.event-name{font-weight:800}.event-meta{display:block;color:#60737c;font-size:.84rem}.result{display:inline-flex;margin-top:.45rem;border-radius:999px;background:#ecfdf5;color:#086c51;padding:.18rem .55rem;font-size:.76rem;font-weight:800}.empty{color:#71838b}section[hidden],.identity-card[hidden]{display:none}@media(max-width:760px){.card-shell{grid-template-columns:1fr}.identity-card{max-width:25rem;margin:auto}.content{padding:1.25rem}}
</style></head>
<body><main><div class="card-shell"><div id="card-artwork" class="identity-card" hidden></div><article class="content"><p id="festival" class="eyebrow">Festival ID</p><h1 id="person">Scan your ID card</h1><p id="details" class="meta" role="status">Use the QR code printed on your card.</p><section hidden><h2>Registered events</h2><ul class="event-list"></ul></section></article></div></main>
<script type="module" src="./card-view.js"></script></body></html>
